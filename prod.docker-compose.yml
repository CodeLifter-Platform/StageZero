services:
  # ═══════════════════════════════════════════════════════════════
  # STAGEZERO PRODUCTION (BEHIND CLOUDFLARE TUNNEL)
  # ═══════════════════════════════════════════════════════════════
  # Plain HTTP on purpose: Cloudflare terminates TLS at its edge and cloudflared
  # forwards to this container over the local network. The app reads
  # X-Forwarded-Proto to know the original request was https.
  # ═══════════════════════════════════════════════════════════════
  prod-stagezero:
    container_name: prod-stagezero
    image: stagezero:latest
    build:
      context: .
      dockerfile: StageZero/Dockerfile
      target: release
    ports:
      # Bound to the loopback interface — the tunnel is the only way in.
      # Change to "5100:80" if cloudflared runs on a different machine.
      - "127.0.0.1:5100:80"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
    volumes:
      # Application data (database, logs, data-protection keys).
      # The dp-keys directory MUST persist or the stored Cloudflare API token
      # cannot be decrypted after a restart.
      - ${STAGEZERO_DATA_DIR:-./.volumes/stagezero-data}:/app-data
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ═══════════════════════════════════════════════════════════════
  # CLOUDFLARED CONNECTOR (OPTIONAL SIDECAR)
  # ═══════════════════════════════════════════════════════════════
  # Only starts with: docker compose --profile tunnel up -d
  #
  # Prefer installing cloudflared as a host service (launchd / Windows service /
  # systemd) so the connector survives this stack going down, and so routes can
  # point at other machines on the LAN. Use this sidecar when you'd rather have
  # a single `docker compose up`. Get TUNNEL_TOKEN from the Tunnel Setup page.
  #
  # Note: with the sidecar, tunnel routes should forward to
  # http://prod-stagezero:80 (the compose network) rather than localhost.
  # ═══════════════════════════════════════════════════════════════
  cloudflared:
    container_name: prod-cloudflared
    image: cloudflare/cloudflared:latest
    profiles:
      - tunnel
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - prod-stagezero
    restart: unless-stopped
