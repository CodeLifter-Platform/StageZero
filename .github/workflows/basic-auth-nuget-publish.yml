# Lifted.BlazorAuth.Basic — build, pack, publish.
#
# Versioning follows the CodeLifter platform contract: BASE_VERSION + run number,
# RELEASE_LEVEL for prerelease suffixes, NO manual tags. The package version is the
# computed version, and a push to main publishes it. Pushing a v*.*.* tag by hand used
# to be the publish trigger; it isn't any more.
# See Platform-Standards/process/versioning-ci.md.

name: Build and Publish NuGet Package

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'Lifted.BlazorAuth.Basic/Lifted.BlazorAuth.Basic.csproj'
  PACKAGE_OUTPUT_DIR: './nupkgs'

jobs:
  # ── Compute version (platform contract — copied verbatim) ──────
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
      version_tag: ${{ steps.semver.outputs.version_tag }}
      is_release: ${{ steps.semver.outputs.is_release }}
      is_prerelease: ${{ steps.semver.outputs.is_prerelease }}
    steps:
      - name: Generate semantic version
        id: semver
        run: |
          BASE="${{ vars.BASE_VERSION || '0.9' }}"
          LEVEL="${{ vars.RELEASE_LEVEL || '' }}"
          PATCH="${{ github.run_number }}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          IS_MAIN="${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}"

          if [ "$IS_MAIN" = "true" ]; then
            if [ -n "$LEVEL" ]; then
              VERSION="${BASE}.${PATCH}-${LEVEL}"
              IS_PRERELEASE="true"
            else
              VERSION="${BASE}.${PATCH}"
              IS_PRERELEASE="false"
            fi
            IS_RELEASE="true"
          else
            VERSION="${BASE}.${PATCH}-pre.${GITHUB_RUN_NUMBER}+${SHORT_SHA}"
            IS_RELEASE="false"
            IS_PRERELEASE="true"
          fi

          {
            echo "version=$VERSION"
            echo "version_tag=v${VERSION}"
            echo "is_release=$IS_RELEASE"
            echo "is_prerelease=$IS_PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Version: \`${VERSION}\`"
            echo "Release: ${IS_RELEASE} · Prerelease: ${IS_PRERELEASE}"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and Test
    needs: version
    runs-on: ubuntu-latest
    env:
      # NuGet rejects build metadata (+sha), so strip it for the package version.
      APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        # GeneratePackageOnBuild is set in the csproj, which emits a 0.0.1 package here
        # and gets pushed alongside the real one. The explicit pack step below owns
        # packaging, and it is the only step that knows the computed version.
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore -p:GeneratePackageOnBuild=false

      - name: Run tests (if any)
        run: dotnet test --configuration Release --verbosity normal
        continue-on-error: true # Continue if no test projects exist

      - name: Pack NuGet package
        run: |
          PKG_VERSION="${APP_VERSION%%+*}"
          echo "Packing $PKG_VERSION"
          dotnet pack ${{ env.PROJECT_PATH }} \
            --configuration Release \
            -p:PackageVersion="$PKG_VERSION" \
            --output ${{ env.PACKAGE_OUTPUT_DIR }}

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ${{ env.PACKAGE_OUTPUT_DIR }}/*.nupkg
          if-no-files-found: error
          retention-days: 7

  # ── Publish (main pushes only, same gate as every other repo's release) ──
  publish-nuget:
    name: Publish to NuGet.org
    needs: [version, build]
    if: ${{ needs.version.outputs.is_release == 'true' }}
    runs-on: ubuntu-latest
    env:
      # Secrets are not readable in a step-level `if:`, so surface presence as job env —
      # the same pattern the signing jobs in the other repos use.
      HAS_NUGET_KEY: ${{ secrets.NUGET_API_KEY != '' }}
    steps:
      - name: Download NuGet package artifact
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: ${{ env.PACKAGE_OUTPUT_DIR }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Warn when the NuGet key is unavailable
        if: ${{ env.HAS_NUGET_KEY != 'true' }}
        run: echo "::warning::NUGET_API_KEY secret not set — skipping the NuGet.org push. The package is still built, attached as an artifact, and published to GitHub Packages."

      # Publish when the key is present, never fail the build when it is absent — the
      # platform rule that already governs code signing. Without this the whole pipeline
      # went red on main for a missing credential, after a build that succeeded.
      - name: Publish to NuGet.org
        if: ${{ env.HAS_NUGET_KEY == 'true' }}
        run: |
          dotnet nuget push ${{ env.PACKAGE_OUTPUT_DIR }}/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

  publish-github:
    name: Publish to GitHub Packages
    needs: [version, build]
    if: ${{ needs.version.outputs.is_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Download NuGet package artifact
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: ${{ env.PACKAGE_OUTPUT_DIR }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push ${{ env.PACKAGE_OUTPUT_DIR }}/*.nupkg \
            --api-key "$GH_TOKEN" \
            --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
            --skip-duplicate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
