# RELEASE MAJOR — the button.
#
# Promotes the newest pre-release to a full release: major + 1, minor/patch -> 0.
# 0.6.3-pre   ->  1.0.0
#
# It REBUILDS the pre-release's commit with the release version compiled in, so the shipped
# binaries actually report 1.0.0 rather than the pre-release version. Same source,
# correct version — see promote.yml for what that costs.
#
# workflow_dispatch requires write access, so this button is not available to forks or
# read-only collaborators. For a stricter gate, add an `environment:` with required
# reviewers to the job below.

name: RELEASE MAJOR

on:
  workflow_dispatch:

permissions:
  contents: write
  # StageZero ships a container image: the rebuild pushes and signs it (build.yml, publish).
  # A called workflow can only use what its caller grants.
  packages: write
  id-token: write
  attestations: write
  pull-requests: read

jobs:
  release:
    uses: ./.github/workflows/promote.yml
    with:
      bump: major
    secrets: inherit
